[[trigger]]
name = "ac-online"
device = "/devices/pci0000:00/0000:00:1f.0/PNP0C09:00/ACPI0003:00/power_supply/AC"
property = "POWER_SUPPLY_ONLINE"
value-map = { 0 = "bat", 1 = "ac" }

[[action]]
trigger = "ac-online"
type = "simple-file"
file = "/sys/bus/pci/devices/*/power/control"
values = { "ac" = "auto", bat = "auto" }

[[action]]
trigger = "ac-online"
type = "simple-file"
file = "/sys/bus/usb/devices/*/power/control"
values = { "ac" = "auto", bat = "auto" }

[[action]]
trigger = "ac-online"
type = "sysctl"
ctl = "vm.laptop_mode"
values = { ac = "1", bat = "5" }

[[action]]
trigger = "ac-online"
type = "simple-file"
file = "/sys/class/platform-profile/platform-profile-0/profile"
values = { ac = "performance", bat = "low-power" }

[[action]]
trigger = "ac-online"
type = "simple-file"
file = "/sys/devices/system/cpu/*/cpufreq/energy_performance_preference"
values = { ac = "performance", bat = "balance_power" }

[[action]]
trigger = "ac-online"
type = "simple-file"
file = "/sys/devices/system/cpu/*/cpufreq/scaling_governor"
values = { ac = "performance", bat = "powersave" }

[[action]]
trigger = "ac-online"
type = "simple-file"
file = "/sys/devices/system/cpu/*/power/energy_perf_bias"
values = { ac = "0", bat = "12" }
